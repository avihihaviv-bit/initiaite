<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סדר יום</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>סדר יום</h1>
            <div class="day-nav">
                <button id="prev-day" class="nav-btn" aria-label="יום קודם">&rsaquo;</button>
                <div class="day-label">
                    <span id="day-name"></span>
                    <span id="day-date"></span>
                </div>
                <button id="next-day" class="nav-btn" aria-label="יום הבא">&lsaquo;</button>
            </div>
            <button id="today-btn" class="today-btn">היום</button>
        </header>

        <form id="add-form" class="add-form">
            <input type="time" id="task-time" class="task-time-input" required>
            <input type="text" id="task-title" class="task-title-input" placeholder="מה יש היום?" required maxlength="120">
            <button type="submit" class="add-btn">הוסף</button>
        </form>

        <main>
            <ul id="task-list" class="task-list"></ul>
            <p id="empty-state" class="empty-state">אין עדיין משימות ליום הזה.</p>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
