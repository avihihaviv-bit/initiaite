<style>
  /* The 404 borrows the site's tokens but needs none of its machinery. */
  .nf {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: var(--space-6) var(--container-pad);
    text-align: center;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(226, 73, 44, 0.16), transparent 70%),
      var(--color-cream);
  }
  .nf-inner { max-width: 46ch; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
  .nf-logo { width: 108px; height: auto; }
  .nf-code {
    font-family: var(--font-display);
    font-size: clamp(3.4rem, 16vw, 6rem);
    line-height: 1;
    color: var(--color-tomato-dark);
    letter-spacing: 0.02em;
  }
  .nf h1 { font-family: var(--font-display); font-size: clamp(1.4rem, 5vw, 2.1rem); line-height: 1.2; }
  .nf p { color: var(--color-charcoal-soft); font-size: 1.02rem; line-height: 1.6; margin: 0; }
  .nf-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: center; margin-top: var(--space-2); }
  .nf-links { margin-top: var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); justify-content: center; }
  .nf-links a { color: var(--color-charcoal-soft); font-size: 0.9rem; text-decoration: underline; text-underline-offset: 3px; }
  .nf-links a:hover, .nf-links a:focus-visible { color: var(--color-tomato-dark); }
</style>

<main class="nf">

      <a href="/#faq">שאלות נפוצות</a>
      <a href="tel:+97236225040">03-622-5040</a>
    </nav>
  </div>
