<!DOCTYPE html>
<html lang="he" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initiate // Sign In</title>

    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#121a2b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Initiate">

    <script>
        // Already have a live session? Skip straight to the app.
        if (sessionStorage.getItem('initiate_token')) { location.replace('index.html'); }
    </script>
    <link rel="stylesheet" href="styles.css">
    <script src="icons.js"></script>
</head>
<body dir="rtl" id="html-root">

    <button class="lang-btn login-lang" onclick="toggleLoginLanguage()" id="lang-toggle-btn">EN</button>

    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-brand-mark" id="brand-mark"></div>
                <div class="login-title" data-i18n="appTitle">INITIATE // ניידת סיור</div>
                <div class="login-subtitle" data-i18n="loginSubtitle">כניסה מאובטחת למערכת</div>
            </div>

            <div id="login-error" class="login-error">
                <span id="login-error-icon"></span>
                <span id="login-error-text" data-i18n="invalidCreds">שם משתמש או סיסמה שגויים</span>
            </div>

            <form id="login-form" autocomplete="off">
                <div class="login-field">
                    <span id="user-icon"></span>
                    <input type="text" id="login-username" class="modal-input" data-i18n-placeholder="usernamePlaceholder" placeholder="שם משתמש" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <span id="lock-icon"></span>
                    <input type="password" id="login-password" class="modal-input" data-i18n-placeholder="passwordPlaceholder" placeholder="סיסמה" autocomplete="current-password" required>
                    <button type="button" class="toggle-visibility" id="toggle-visibility-btn" aria-label="Show password"></button>
                </div>
                <button type="submit" class="btn btn-primary" id="login-submit-btn" style="margin-top: 14px;">
                    <span id="login-submit-icon"></span>
                    <span id="login-submit-text" data-i18n="signIn">כניסה למערכת</span>
                </button>
            </form>

            <div class="login-hint" data-i18n="demoHint">
                גרסת הדגמה &mdash; משתמש: <code>patrol12</code> &nbsp;סיסמה: <code>patrol2026</code>
            </div>
        </div>
    </div>

    <script>
        const i18nLogin = {
            HE: {
                appTitle: "INITIATE // ניידת סיור",
                loginSubtitle: "כניסה מאובטחת למערכת",
                usernamePlaceholder: "שם משתמש",
                passwordPlaceholder: "סיסמה",
                signIn: "כניסה למערכת",
                signingIn: "מתחבר...",
                invalidCreds: "שם משתמש או סיסמה שגויים",
                connError: "שגיאת תקשורת עם השרת. נסה שוב.",
                fillFields: "נא למלא שם משתמש וסיסמה",
                demoHint: 'גרסת הדגמה &mdash; משתמש: <code>patrol12</code> &nbsp;סיסמה: <code>patrol2026</code>'
            },
            EN: {
                appTitle: "INITIATE // PATROL C2",
                loginSubtitle: "Secure Terminal Access",
                usernamePlaceholder: "Username",
                passwordPlaceholder: "Password",
                signIn: "Sign In",
                signingIn: "Signing in...",
                invalidCreds: "Invalid username or password",
                connError: "Could not reach the server. Try again.",
                fillFields: "Please enter a username and password",
                demoHint: 'Demo build &mdash; user: <code>patrol12</code> &nbsp;password: <code>patrol2026</code>'
            }
        };
        let loginLang = 'HE';

        document.getElementById('brand-mark').innerHTML = svgIcon('shield', 'icon-lg');
        document.getElementById('user-icon').outerHTML = svgIcon('user');
        document.getElementById('lock-icon').outerHTML = svgIcon('lock');
        document.getElementById('login-error-icon').outerHTML = svgIcon('alertTriangle');
        renderVisibilityIcon(false);

        function renderVisibilityIcon(visible) {
            document.getElementById('toggle-visibility-btn').innerHTML = svgIcon(visible ? 'eyeOff' : 'eye');
        }

        function toggleLoginLanguage() {
            loginLang = loginLang === 'HE' ? 'EN' : 'HE';
            document.getElementById('lang-toggle-btn').innerText = loginLang === 'HE' ? 'EN' : 'עב';
            const t = i18nLogin[loginLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
        }

        document.getElementById('toggle-visibility-btn').addEventListener('click', () => {
            const pwd = document.getElementById('login-password');
            const nowVisible = pwd.type === 'password';
            pwd.type = nowVisible ? 'text' : 'password';
            renderVisibilityIcon(nowVisible);
        });

        function showLoginError(message) {
            const box = document.getElementById('login-error');
            document.getElementById('login-error-text').innerText = message;
            box.style.display = 'flex';
        }
        function hideLoginError() { document.getElementById('login-error').style.display = 'none'; }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideLoginError();
            const t = i18nLogin[loginLang];
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            if (!username || !password) { showLoginError(t.fillFields); return; }

            const btn = document.getElementById('login-submit-btn');
            const submitIcon = document.getElementById('login-submit-icon');
            const submitText = document.getElementById('login-submit-text');
            btn.disabled = true;
            submitIcon.innerHTML = '<span class="spinner"></span>';
            submitText.innerText = t.signingIn;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('initiate_token', data.token);
                    sessionStorage.setItem('initiate_username', data.username);
                    location.replace('index.html');
                    return;
                }
                showLoginError(t.invalidCreds);
            } catch (err) {
                showLoginError(t.connError);
            } finally {
                btn.disabled = false;
                submitIcon.innerHTML = '';
                submitText.innerText = t.signIn;
            }
        });
    </script>
</body>
</html>
